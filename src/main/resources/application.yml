minio:
    internal-endpoint: ${MINIO_INTERNAL_ENDPOINT}
    external-endpoint: ${MINIO_EXTERNAL_ENDPOINT}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET_NAME}

uploads:
  profile-image:
    max-size: 5MB
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/webp

management:
    endpoints:
        web:
            exposure:
                include: health, info, refresh, metrics, prometheus

jwt:
    access-secret: ${ACCESS_JWT_SECRET}
    refresh-secret: ${REFRESH_JWT_SECRET}
    access-duration: ${ACCESS_JWT_DURATION}
    refresh-duration: ${REFRESH_JWT_DURATION}
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}

ms-user-config:
    client-app-url: ${CLIENT_URL}

    user-account-auto-enabled: false

    email-sender-intern: true
    email-sender-app: czerkies.ludovic.pro@outlook.fr

    super-admin-username: ${SUPER_ADMIN_USERNAME}
    super-admin-email: ${SUPER_ADMIN_EMAIL}
    super-admin-password: ${SUPER_ADMIN_PASSWORD}

server:
    port: ${MS_USER_PORT}
