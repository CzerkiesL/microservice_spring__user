spring:
    application:
        name: ms-user
    config:
        import:
            - optional:file:.env[.properties]
    #            - optional:configserver:${CONFIG_SERVER_URL:http://localhost:9999} Seulement si il est associer a un serveur de config
    
    rabbitmq:
        host: ${RABBITMQ_HOST}
        port: ${RABBITMQ_AMQP_PORT}
        username: ${RABBITMQ_USERNAME}
        password: ${RABBITMQ_PASSWORD}
    
    jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        open-in-view: false
        properties:
          hibernate:
            id:
              uuid:
                strategy: binary
            format-sql: true
    
    datasource:
        url: ${SPRING_DATASOURCE_URL}
        username: ${SPRING_DATASOURCE_USERNAME}
        password: ${SPRING_DATASOURCE_PASSWORD}
        driver-class-name: org.mariadb.jdbc.Driver
    
    mail:
        host: ${SPRING_MAIL_HOST}
        port: ${SPRING_MAIL_PORT}
        username: ${SPRING_MAIL_USERNAME}
        password: ${SPRING_MAIL_PASSWORD}
        protocol: ${SPRING_MAIL_PROTOCOL}
        default-encoding: UTF-8
        properties: 
          mail:
            smtp:
              auth: true
              starttls:
                enable: true

